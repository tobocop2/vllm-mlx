name: rev-apple

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Fork ref (branch or sha) under test
        required: true
        type: string
      mode:
        description: arms or flake (acceptance/rev_arms.py)
        required: true
        type: string

jobs:
  rev-apple:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Check out the harness (ci/model-test)
        uses: actions/checkout@v4

      - name: Check out the ref under test into src/
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest-xdist
          pip install -e "./src[dev,vision,harmony]"
          python -c "import mlx.core as mx; print(f'MLX OK: {mx.default_device()}')"

      - name: Run the reviewer instrument
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in arms|flake|arms2|arms3|arms4|rework) ;; *) echo "bad mode"; exit 2 ;; esac
          set -o pipefail
          if [ "$MODE" = arms2 ]; then python acceptance/rev_arms2.py src 2>&1; elif [ "$MODE" = rework ]; then python acceptance/rework_arms.py src 2>&1; elif [ "$MODE" = arms5 ]; then python acceptance/rev_arms5.py arms src 2>&1; elif [ "$MODE" = arms4 ]; then python acceptance/rev_arms4.py arms src 2>&1; elif [ "$MODE" = arms3 ]; then python acceptance/rev_arms3.py arms src 2>&1; else python acceptance/rev_arms.py "$MODE" src 2>&1; fi | tee "rev-$MODE.log"
          echo "REV_APPLE_DONE mode=$MODE rc=${PIPESTATUS[0]}"
